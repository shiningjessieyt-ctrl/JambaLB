<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral Wager Leaderboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #d97706;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .leaderboard-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .status-bar {
      padding: 0.75rem 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #182232;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    tr:last-child td { border-bottom: none; }
    
    .rank { font-weight: bold; width: 80px; }
    .rank-1 { color: var(--gold); }
    .rank-2 { color: var(--silver); }
    .rank-3 { color: var(--bronze); }

    .amount {
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: right;
    }

    th.amount-header {
      text-align: right;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Referral Wager Leaderboard</h1>
  </div>

  <div class="leaderboard-card">
    <div class="status-bar">
      <span id="statusText">Loading leaderboard data...</span>
      <span id="cacheText"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>User</th>
          <th class="amount-header">Weighted Wager</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <tr>
          <td colspan="3" style="text-align:center; color: var(--text-muted);">Fetching latest wagers...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // YOUR BACKEND PROXY URL
  const PROXY_URL = 'https://jambalb.onrender.com/api/leaderboard';

  // Automatically calculate the date range (Last 7 days by default)
  const today = new Date();
  const prior = new Date();
  prior.setDate(today.getDate() - 7);

  const endAt = today.toISOString().split('T')[0];
  const startAt = prior.toISOString().split('T')[0];

  let rawData = [];

  async function loadLeaderboard() {
    const statusText = document.getElementById('statusText');

    try {
      const response = await fetch(`${PROXY_URL}?start_at=${startAt}&end_at=${endAt}`);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      
      const data = await response.json();
      rawData = data.affiliates || [];

      document.getElementById('cacheText').innerText = data.cached ? 'Cached (Refreshes every 15m)' : 'Live Data';
      statusText.innerText = 'Leaderboard Updated';
      renderTable();
    } catch (err) {
      console.error(err);
      statusText.innerText = 'Error fetching leaderboard data.';
    }
  }

  function renderTable() {
    const tbody = document.getElementById('leaderboardBody');
    tbody.innerHTML = '';

    if (!rawData || rawData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: var(--text-muted);">No wager data found for this period.</td></tr>`;
      return;
    }

    const sorted = [...rawData].sort((a, b) => (parseFloat(b.weighted_wagered_amount) || 0) - (parseFloat(a.weighted_wagered_amount) || 0));

    sorted.forEach((item, index) => {
      const rankNum = index + 1;
      const rankClass = rankNum <= 3 ? `rank-${rankNum}` : '';
      const username = item.username || 'Anonymous';
      const weightedAmount = parseFloat(item.weighted_wagered_amount || 0).toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="rank ${rankClass}">#${rankNum}</td>
        <td>${escapeHtml(username)}</td>
        <td class="amount">$${weightedAmount}</td>
      `;
      tbody.appendChild(row);
    });
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Load leaderboard instantly on page open
  window.onload = loadLeaderboard;
</script>

</body>
</html>
